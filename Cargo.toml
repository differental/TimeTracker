[package]
name = "timetracker"
version = "1.4.2"
edition = "2024"

[dependencies]
anyhow = "1.0"
askama = { version = "0.16", features = ["serde_json"] }
axum = { version = "0.8", features = ["macros"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
mime_guess = "2.0"
num = "0.4"
rust-embed = "8.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sled = "0.34"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7", features = ["compression-br", "compression-gzip", "fs"] }

[profile.release-prod]
inherits = "release"
lto = "fat"
strip = true
codegen-units = 1

