[package]
name = "timetracker"
version = "2.0.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
axum = "0.8"
chrono = "0.4"
dotenvy = "0.15"
serde = { version = "1.0", features = ["derive"] }
sled = "0.34"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tower-http = { version = "0.7", features = ["compression-br", "compression-gzip"] }

[dev-dependencies]
serde_json = "1.0"

[profile.release-prod]
inherits = "release"
lto = "fat"
strip = true
codegen-units = 1

