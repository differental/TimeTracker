<!DOCTYPE html>
<html lang="en" style="--state: {{ current_state.colour }}"{% if is_emergency %} data-emergency="true"{% endif %}>
<head>
    <title>TimeTracker — Activity Breakdown</title>
    {% include "header.html" %}
</head>
<body>
    {% include "navbar.html" %}
    <main class="page shell">
        <div class="page-head">
            <div>
                <h1 class="page-title">Summary</h1>
                <p class="page-sub">How your time divides up.</p>
            </div>
            <div class="range" role="group" aria-label="Time range">
                <button type="button" class="range-btn" data-range="1" aria-pressed="false"><span>24 h</span></button>
                <button type="button" class="range-btn" data-range="7" aria-pressed="true"><span>7 d</span></button>
                <button type="button" class="range-btn" data-range="30" aria-pressed="false"><span>30 d</span></button>
            </div>
        </div>

        <p class="notice hidden" id="summary-error" role="alert"></p>

        <div class="summary-grid">
            <div class="card donut-card">
                <svg id="pie" viewBox="0 0 42 42" role="img" aria-label="Donut chart of time spent per activity"></svg>
                <div class="donut-face">
                    <span id="range-label">Tracked</span>
                    <span id="range-total" class="tnum">—</span>
                    <span id="range-pct" class="tnum"></span>
                </div>
            </div>
            <ul id="legend" class="card"></ul>
        </div>
    </main>

    {% include "footer.html" %}
    <script>
        window.ENTRY_KEY = "{{ key }}";
        const STATES_DATA = [
            {% for s in states %}["{{ s.emoji }} {{ s.name }}", "{{ s.colour }}"], {% endfor %}
        ];

        document.addEventListener('DOMContentLoaded', () => loadRange(7));
    </script>
    <script src="/static/js/summary.js" defer></script>
</body>
</html>
