<!DOCTYPE html>
<html lang="en" style="--state: {{ current_state.colour }}"{% if is_emergency %} data-emergency="true"{% endif %}>
<head>
    <title>TimeTracker — Current Activity</title>
    {% include "header.html" %}
</head>
<body>
    <div class="aurora" aria-hidden="true">
        <span class="b1"></span>
        <span class="b2"></span>
        <span class="b3"></span>
    </div>
    {% include "navbar.html" %}
    <main class="page shell">
        <div class="page-head">
            <h1 class="page-title">Now</h1>
            <p class="page-sub">Your last 24 hours, midnight at the top.</p>
        </div>

        <section class="card now">
            <div class="dial-wrap">
                <svg id="dial" class="dial" viewBox="0 0 200 200" role="img"
                    aria-label="Radial chart of your activities over the last 24 hours"></svg>
                <div class="now-face">
                    <h2 class="now-state" id="current-state">{{ current_state.emoji }} {{ current_state.name }}</h2>
                    <p class="now-elapsed tnum" id="elapsed">-</p>
                    <span class="now-since" id="since"></span>
                </div>
            </div>
        </section>

        <section>
            <p class="eyebrow">Switch to</p>
            <noscript>
                <style>
                    #suggest-list,
                    #all-activities-btn {
                        display: none !important;
                    }

                    #all-activities-panel {
                        display: grid !important;
                    }
                </style>
            </noscript>
            <div class="suggest-list" id="suggest-list" aria-busy="true">
                <span class="suggest-skel"></span>
                <span class="suggest-skel"></span>
                <span class="suggest-skel"></span>
            </div>
            <button type="button" class="all-activities-btn" id="all-activities-btn"
                aria-expanded="false" aria-controls="all-activities-panel">
                <span>All activities</span>
                <svg class="chev" viewBox="0 0 12 8" aria-hidden="true">
                    <path d="M1 1.5 6 6.5 11 1.5" fill="none" stroke="currentColor"
                        stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
            </button>
            <div class="state-grid hidden" id="all-activities-panel">
                {% for s in states %}
                <button type="button" class="change-state-btn rise"
                    style="--swatch: {{ s.colour }}; --delay: {{ loop.index0 * 25 }}ms"
                    value="{{ loop.index0 }}"
                    {% if s.name == current_state.name %}aria-current="true"{% endif %}
                    aria-label="Change state to {{ s.name }}">
                    <span class="emoji" aria-hidden="true">{{ s.emoji }}</span>
                    <span class="label">{{ s.name }}</span>
                </button>
                {% endfor %}
            </div>
        </section>
    </main>

    <dialog id="switch-sheet" class="sheet" aria-labelledby="switch-title">
        <div class="sheet-body">
            <h2 class="sheet-title" id="switch-title" tabindex="-1" autofocus>Change activity</h2>
            <p class="sheet-note">Switch to <b id="switch-target"></b>, starting when?</p>
            <div class="sheet-row">
                <input id="switch-start-input" class="field" type="datetime-local" step="60">
                <button type="button" id="switch-now-btn" class="btn btn-now" aria-pressed="true">NOW</button>
            </div>
            <p class="sheet-error hidden" id="switch-error" role="alert"></p>
            <div class="sheet-actions">
                <button type="button" class="btn" id="switch-cancel">Cancel</button>
                <button type="button" class="btn btn-primary" id="switch-confirm">Change activity</button>
            </div>
        </div>
    </dialog>

    {% include "footer.html" %}
    <script>
        window.ENTRY_KEY = "{{ key }}";
        const start = Date.now() - {{ elapsed_ms }};
        const HAS_ENTRY = {{ elapsed_ms }} > 0;
        const STATE_META = [
            {% for s in states %}["{{ s.emoji }}", "{{ s.name }}", "{{ s.colour }}"], {% endfor %}
        ];
        const STATES_NAMES = STATE_META.map(s => s[1]);

        setInterval(() => updateElapsed(), 1000);
        document.addEventListener('DOMContentLoaded', () => updateElapsed());
    </script>
    <script src="/static/js/dial.js" defer></script>
    <script src="/static/js/index.js" defer></script>
    <script src="/static/js/suggest.js" defer></script>
</body>
</html>
