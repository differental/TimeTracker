<!DOCTYPE html>
<html lang="en" style="--state: {{ current_state.colour }}"{% if is_emergency %} data-emergency="true"{% endif %}>
<head>
    <title>TimeTracker — Activities</title>
    {% include "header.html" %}
</head>
<body>
    {% include "navbar.html" %}
    <main class="page shell">
        <div class="page-head">
            <div>
                <h1 class="page-title">Activities</h1>
                <p class="page-sub">Every state you can track, its colour, and what it covers.</p>
            </div>
        </div>

        <div class="state-cards">
            {% for s in states %}
            <article class="state-card rise" style="--swatch: {{ s.colour }}; --delay: {{ loop.index0 * 25 }}ms">
                <h2>
                    <span aria-hidden="true">{{ s.emoji }}</span>
                    <span>{{ s.name }}</span>
                    <span class="state-index">{{ loop.index0 }}</span>
                </h2>
                <p>{{ s.description }}</p>
            </article>
            {% endfor %}
        </div>
    </main>

    {% include "footer.html" %}
</body>
</html>
